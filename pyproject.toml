[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ctxpack"
version = "0.1.0"
description = "Zero-dependency CLI to pack folder files into a token-budgeted markdown bundle"
requires-python = ">=3.10"

[project.scripts]
ctxpack = "ctxpack:main"
